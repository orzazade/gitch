name: Publish to WinGet

# =============================================================================
# IMPORTANT: First Version Must Be Submitted Manually
# =============================================================================
# This workflow only works AFTER the first version has been accepted into
# microsoft/winget-pkgs. Before the first release with this workflow:
#
# 1. Install wingetcreate:
#    winget install wingetcreate
#
# 2. Create manifest for current release:
#    wingetcreate new https://github.com/orzazade/gitch/releases/download/v2.0.0/gitch_2.0.0_windows_amd64.zip
#
# 3. Follow prompts:
#    - PackageIdentifier: Orzazade.Gitch
#    - Publisher: Orkhan Rzazade
#    - PackageName: gitch
#    - License: MIT
#    - ShortDescription: Git identity manager - never commit with the wrong identity again
#
# 4. Submit PR:
#    wingetcreate submit <manifest-path>
#    Or manually create PR to microsoft/winget-pkgs
#
# 5. Wait for approval (can take 1-7 days)
#
# 6. After approval, this workflow will auto-submit updates for future releases
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Release tag to publish to WinGet (optional if the action can infer the latest release)'
        required: false

permissions:
  contents: read

concurrency:
  group: winget-${{ github.event.inputs.release-tag || 'latest' }}
  cancel-in-progress: false

jobs:
  winget:
    name: Publish to WinGet
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Validate release tag input
        if: github.event.inputs.release-tag
        shell: bash
        run: |
          case "${{ github.event.inputs.release-tag }}" in
            v[0-9]*.[0-9]*.[0-9]*)
              ;;
            *)
              echo "release-tag must be a semver release tag such as v2.3.0" >&2
              exit 1
              ;;
          esac

      - name: Preflight
        id: preflight
        shell: bash
        run: |
          if [ -z "${{ secrets.WINGET_TOKEN }}" ]; then
            echo "WINGET_TOKEN is not configured; skipping WinGet publish."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Publish to WinGet
        if: steps.preflight.outputs.enabled == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Orzazade.Gitch
          installers-regex: '_windows_amd64\.zip$'
          release-tag: ${{ github.event.inputs.release-tag }}
          token: ${{ secrets.WINGET_TOKEN }}
