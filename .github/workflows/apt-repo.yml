name: Update APT Repository
# =============================================================================
# APT Repository Setup (One-Time)
# =============================================================================
# This workflow requires a one-time setup of the apt-repo branch.
# Run these commands locally before the first release:
#
# 1. Generate GPG key (no passphrase for CI):
#    gpg --batch --gen-key <<EOF
#    Key-Type: RSA
#    Key-Length: 4096
#    Name-Real: gitch APT Repository
#    Name-Email: gitch@orzazade.github.io
#    Expire-Date: 0
#    %no-protection
#    EOF
#
# 2. Get the key ID:
#    gpg --list-keys --keyid-format long gitch@orzazade.github.io
#    # Note the key ID (e.g., ABCD1234EFGH5678)
#
# 3. Export private key for GitHub secret:
#    gpg --armor --export-secret-keys gitch@orzazade.github.io
#    # Add this as APT_GPG_PRIVATE_KEY secret in GitHub
#
# 4. Create apt-repo branch with reprepro config:
#    git checkout --orphan apt-repo
#    git rm -rf .
#    mkdir -p conf
#    cat > conf/distributions <<EOF
#    Origin: gitch
#    Label: gitch
#    Codename: stable
#    Architectures: amd64 arm64
#    Components: main
#    Description: gitch - Git Identity Manager
#    SignWith: YOUR_GPG_KEY_ID
#    EOF
#
# 5. Export public key:
#    gpg --armor --export gitch@orzazade.github.io > KEY.gpg
#
# 6. Commit and push:
#    git add conf/distributions KEY.gpg
#    git commit -m "Initialize APT repository"
#    git push -u origin apt-repo
#
# 7. Enable GitHub Pages:
#    Repository Settings -> Pages -> Source: Deploy from branch -> apt-repo -> / (root)
#
# User installation:
#    curl -fsSL https://orzazade.github.io/gitch/KEY.gpg | sudo gpg --dearmor -o /etc/apt/keyrings/gitch.gpg
#    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/gitch.gpg] https://orzazade.github.io/gitch stable main" | sudo tee /etc/apt/sources.list.d/gitch.list
#    sudo apt update && sudo apt install gitch
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to import into the APT repo (for example v2.3.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: apt-repo-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  update-apt-repo:
    name: Update APT Repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate tag input
        run: |
          case "${{ github.event.inputs.tag }}" in
            v[0-9]*.[0-9]*.[0-9]*)
              ;;
            *)
              echo "tag must be a semver release tag such as v2.3.0" >&2
              exit 1
              ;;
          esac

      - name: Preflight
        id: preflight
        run: |
          if [ -z "${{ secrets.APT_GPG_PRIVATE_KEY }}" ]; then
            echo "APT_GPG_PRIVATE_KEY is not configured; skipping APT publish."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Checkout apt-repo branch
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/checkout@v5
        with:
          ref: apt-repo
          fetch-depth: 0

      - name: Install dependencies
        if: steps.preflight.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro gnupg

      - name: Import GPG key
        if: steps.preflight.outputs.enabled == 'true'
        run: |
          echo "${{ secrets.APT_GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Download .deb packages from release
        if: steps.preflight.outputs.enabled == 'true'
        run: |
          mkdir -p incoming
          gh release download "${{ github.event.inputs.tag }}" \
            --pattern "*.deb" \
            --dir incoming
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add packages to repository
        if: steps.preflight.outputs.enabled == 'true'
        run: |
          mapfile -t debs < <(find incoming -maxdepth 1 -name '*.deb' -print)

          if [ "${#debs[@]}" -eq 0 ]; then
            echo "No .deb artifacts were found for ${{ github.event.inputs.tag }}" >&2
            exit 1
          fi

          for deb in "${debs[@]}"; do
            reprepro -b . includedeb stable "$deb"
          done
          rm -rf incoming

      - name: Commit and push
        if: steps.preflight.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update APT repo for ${{ github.event.inputs.tag }}"
          git push
